title: Demucs-(steps-${trainer.max_steps})-(bs-${train.batch_size})-(LR-${optimizer.params.learning_rate})-(wd-${optimizer.params.weight_decay})

train:
    batch_size: 64
    num_workers: 10
    shuffle: true
    drop_last: true

model:
    input_channels: 1
    hidden_channels: 64
    conv_stride: 2
    conv_kernel_size: 8
    num_layers: 5
    use_bidirectional: true
    upsampling_rate: 2
    normalize_input: true
    apply_normalization: true
    stability_constant: 1e-5

data_augmentation:
    remix: true
    bandmask: 0.2
    shift: 8000
    shift_same: true
    revecho: false

data:
    sampling_rate: 16000
    max_length: 4.5
    stride: 0.5
    pad: true

trainer:
    accelerator: "gpu"
    max_steps: 26839
    num_sanity_val_steps: 2
    overfit_batches: 0.0
    log_every_n_steps: 5
    val_check_interval: 10

model_checkpoint:
    mode: "min"
    save_last: true
    save_weights_only: true
    monitor: "train_loss"
    dirpath: "../checkpoints/demucs"
    filename: "{epoch:02d}-{step:02d}-{train_loss:.4f}"

optimizer:
    name: adam
    params:
        min_learning_rate: 1e-6
        learning_rate: 3e-4
        betas: [0.9, 0.999]
        eps: 1e-08
        weight_decay: 0.01

scheduler:
    name: cosinewarmuplr
    params:
        warmup_lr: 4000
        total_steps: 80000

logging:
    log_audio_every: 10